version: '3.8'

services:
  server:
    build:
      context: ./Server
      dockerfile: Dockerfile
    container_name: chat-translation-server
    ports:
      - "5000:5000"
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongodb:27017/chat-translation-app
    env_file:
      - ./Server/.env
    depends_on:
      - mongodb
    networks:
      - chat-network
    restart: unless-stopped

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile
    container_name: chat-translation-client
    ports:
      - "80:80"
    depends_on:
      - server
    networks:
      - chat-network
    restart: unless-stopped

  mongodb:
    image: mongo:7
    container_name: chat-translation-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - chat-network
    restart: unless-stopped

networks:
  chat-network:
    driver: bridge

volumes:
  mongodb_data:
